<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Availability Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>🚗 Parking Detection System</h1>
            <div class="nav-links">
                <a href="/" class="active">Dashboard</a>
                <a href="/live">Live View</a>
                <a href="/live">Live View</a>
                <a href="/analytics">Analytics</a>
                <a href="/admin">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h2>Real-Time Parking Availability</h2>
            <div style="display: flex; align-items: center; gap: 1rem; margin-top: 0.5rem;">
                <label for="lotSelector" style="font-weight: 500;">Select Parking Lot:</label>
                <select id="lotSelector" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd; font-size: 1rem;">
                    <option value="">Loading lots...</option>
                </select>
            </div>
            <p class="last-updated">Last updated: <span id="lastUpdated">--</span></p>
        </div>

        <div class="stats-grid">
            <div class="stat-card available">
                <div class="stat-icon">✓</div>
                <div class="stat-content">
                    <h3>Available</h3>
                    <p class="stat-number" id="availableSpaces">--</p>
                </div>
            </div>

            <div class="stat-card occupied">
                <div class="stat-icon">✗</div>
                <div class="stat-content">
                    <h3>Occupied</h3>
                    <p class="stat-number" id="occupiedSpaces">--</p>
                </div>
            </div>

            <div class="stat-card total">
                <div class="stat-icon">📊</div>
                <div class="stat-content">
                    <h3>Total Spaces</h3>
                    <p class="stat-number" id="totalSpaces">--</p>
                </div>
            </div>

            <div class="stat-card occupancy">
                <div class="stat-icon">📈</div>
                <div class="stat-content">
                    <h3>Occupancy Rate</h3>
                    <p class="stat-number" id="occupancyRate">--%</p>
                </div>
            </div>
        </div>

        <div class="content-section">
            <h3>Parking Lot Status</h3>
            <div class="status-indicator">
                <span class="indicator-dot" id="statusIndicator"></span>
                <span id="statusText">Checking status...</span>
            </div>
        </div>

        <div class="content-section">
            <h3>Quick Actions</h3>
            <div class="button-group">
                <button onclick="refreshData()" class="btn btn-primary">Refresh Data</button>
                <button onclick="window.location.href='/live'" class="btn btn-secondary">View Live Feed</button>
                <button onclick="window.location.href='/analytics'" class="btn btn-secondary">View Analytics</button>
            </div>
        </div>
    </div>

    <script>
        let updateInterval;
        let currentLotId = 'LOT-001'; // Default

        async function loadAvailableLots() {
            try {
                const response = await fetch('/api/lots');
                const data = await response.json();
                const selector = document.getElementById('lotSelector');
                
                if (data.lots && data.lots.length > 0) {
                    selector.innerHTML = data.lots.map(lot => 
                        `<option value="${lot.public_id}" ${lot.public_id === currentLotId ? 'selected' : ''}>${lot.name} (${lot.public_id})</option>`
                    ).join('');
                    
                    // Set default to first lot if current doesn't exist
                    if (!data.lots.find(l => l.public_id === currentLotId)) {
                        currentLotId = data.lots[0].public_id;
                        selector.value = currentLotId;
                    }
                } else {
                    selector.innerHTML = '<option value="">No lots available</option>';
                }
                
                // Add change listener
                selector.addEventListener('change', (e) => {
                    currentLotId = e.target.value;
                    fetchParkingStatus();
                });
                
            } catch (error) {
                console.error('Error loading lots:', error);
                document.getElementById('lotSelector').innerHTML = '<option value="">Error loading lots</option>';
            }
        }

        async function fetchParkingStatus() {
            if (!currentLotId) return;
            
            try {
                const response = await fetch(`/api/lot/${currentLotId}/status`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                // Update stats - use available_spaces/occupied_spaces for consistency
                document.getElementById('availableSpaces').textContent = data.available_spaces;
                document.getElementById('occupiedSpaces').textContent = data.occupied_spaces;
                document.getElementById('totalSpaces').textContent = data.total_spaces;
                
                // Calculate occupancy rate
                const occupancyRate = data.total_spaces > 0 ? ((data.occupied_spaces / data.total_spaces) * 100).toFixed(1) : 0;
                document.getElementById('occupancyRate').textContent = occupancyRate + '%';
                
                // Update last updated time
                const lastUpdated = new Date(data.timestamp);
                document.getElementById('lastUpdated').textContent = lastUpdated.toLocaleTimeString();
                
                // Update status indicator
                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                
                if (data.available_spaces > 10) {
                    indicator.className = 'indicator-dot green';
                    statusText.textContent = 'Parking Available';
                } else if (data.available_spaces > 0) {
                    indicator.className = 'indicator-dot yellow';
                    statusText.textContent = 'Limited Availability';
                } else {
                    indicator.className = 'indicator-dot red';
                    statusText.textContent = 'Lot Full';
                }
                
            } catch (error) {
                console.error('Error fetching parking status:', error);
                document.getElementById('statusText').textContent = 'Connection Error';
                document.getElementById('statusIndicator').className = 'indicator-dot red';
            }
        }

        function refreshData() {
            fetchParkingStatus();
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            loadAvailableLots().then(() => {
                fetchParkingStatus();
                // Auto-refresh every 10 seconds
                updateInterval = setInterval(fetchParkingStatus, 10000);
            });
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            clearInterval(updateInterval);
        });
    </script>
</body>
</html>
