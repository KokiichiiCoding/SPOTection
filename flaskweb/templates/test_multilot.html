<!DOCTYPE html>
<html>
<head>
    <title>Test Multi-Lot API</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .section { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 8px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #1a1a1a; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h1>Multi-Lot API Test</h1>
    
    <div class="section">
        <h2>1. Test /api/lots Endpoint</h2>
        <button onclick="testLots()">Test GET /api/lots</button>
        <pre id="lots-result">Click button to test...</pre>
    </div>
    
    <div class="section">
        <h2>2. Test Lot Selection</h2>
        <select id="lotSelect" style="padding: 8px; font-size: 16px;">
            <option value="">Loading...</option>
        </select>
        <button onclick="testCalibration()">Load Calibration for Selected Lot</button>
        <pre id="calib-result">Select a lot and click button...</pre>
    </div>
    
    <div class="section">
        <h2>3. Test Save to LOT-002</h2>
        <button onclick="testSave()">Save Test Space to LOT-002</button>
        <pre id="save-result">Click button to test...</pre>
    </div>

    <script>
        async function testLots() {
            const result = document.getElementById('lots-result');
            try {
                const response = await fetch('/api/lots');
                const data = await response.json();
                
                result.innerHTML = `<span class="success">✓ Success!</span>\n\n` + JSON.stringify(data, null, 2);
                
                // Populate select
                const select = document.getElementById('lotSelect');
                if (data.lots && data.lots.length > 0) {
                    select.innerHTML = data.lots.map(lot => 
                        `<option value="${lot.public_id}">${lot.name} (${lot.public_id})</option>`
                    ).join('');
                }
                
                // Check for public_id
                if (data.lots && data.lots[0]) {
                    if ('public_id' in data.lots[0]) {
                        result.innerHTML += `\n\n<span class="success">✓ 'public_id' field exists!</span>`;
                    } else {
                        result.innerHTML += `\n\n<span class="error">✗ 'public_id' field missing! Found: ${Object.keys(data.lots[0]).join(', ')}</span>`;
                    }
                }
            } catch (error) {
                result.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }
        
        async function testCalibration() {
            const result = document.getElementById('calib-result');
            const lotId = document.getElementById('lotSelect').value;
            
            if (!lotId) {
                result.innerHTML = '<span class="error">Please select a lot first</span>';
                return;
            }
            
            try {
                const response = await fetch(`/api/lot/${lotId}/calibration`);
                const data = await response.json();
                
                result.innerHTML = `<span class="success">✓ Successfully loaded calibration for ${lotId}</span>\n\n` + 
                                 JSON.stringify(data, null, 2);
            } catch (error) {
                result.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }
        
        async function testSave() {
            const result = document.getElementById('save-result');
            
            const testData = {
                calibration_data: [{
                    id: 'TEST-001',
                    polygon: [
                        {x: 0.1, y: 0.1},
                        {x: 0.2, y: 0.1},
                        {x: 0.2, y: 0.2},
                        {x: 0.1, y: 0.2}
                    ],
                    color: '#10b981',
                    status: 'available'
                }],
                total_spaces: 1,
                timestamp: new Date().toISOString()
            };
            
            try {
                result.innerHTML = 'Saving to LOT-002...';
                
                const response = await fetch('/api/lot/LOT-002/calibration', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(testData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    result.innerHTML = `<span class="success">✓ Successfully saved to ${data.lot_id}!</span>\n\n` + 
                                     JSON.stringify(data, null, 2);
                } else {
                    result.innerHTML = `<span class="error">✗ Save failed</span>\n\n` + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                result.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
            }
        }
        
        // Auto-load on page load
        window.onload = () => testLots();
    </script>
</body>
</html>
